services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: storyhouse_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storyhouse_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
